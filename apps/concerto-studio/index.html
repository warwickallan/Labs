<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concerto Configuration Studio</title>
<link rel="stylesheet" href="css/app.css?v=30">
</head>
<body>

<nav id="sidenav">
  <div class="brand">Concerto Studio
    <small>Configuration knowledge &amp; design</small>
  </div>
  <a href="#projects" data-page="projects">Projects</a>
  <div id="navProjects"></div>
  <a href="#settings" data-page="settings">Settings</a>
  <div class="nav-foot" id="navFoot"></div>
</nav>

<main>
  <header id="topbar">
    <h2 id="pageTitle">Projects</h2>
    <span id="ctxWrap" hidden>
      <label for="ctxSelect" class="ctx-label">Project</label>
      <select id="ctxSelect" class="ctx-select"></select>
    </span>
    <span class="spacer"></span>
    <span id="projectChip" class="project-chip empty">No project open</span>
    <span id="srcChip" class="src-chip">loading canonical models…</span>
  </header>
  <div id="ctxInfo" hidden></div>
  <div id="viewbar" hidden></div>
  <div id="content"></div>
</main>

<aside id="inspector" class="hidden">
  <div class="insp-head">
    <h3 id="inspTitle"></h3>
    <button class="insp-close" id="inspClose" title="Close">✕</button>
  </div>
  <div class="insp-body" id="inspBody"></div>
</aside>
