<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concerto Configuration Studio</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<nav id="sidenav">
  <div class="brand">Concerto Studio
    <small>Configuration knowledge &amp; design</small>
  </div>
  <a href="#projects" data-page="projects">Projects</a>
  <a href="#settings" data-page="settings">Settings</a>
  <div class="nav-foot" id="navFoot"></div>
</nav>

<main>
  <header id="topbar">
    <h2 id="pageTitle">Projects</h2>
    <span id="ctxWrap" hidden>
      <label for="ctxSelect" class="ctx-label">Project</label>
      <select id="ctxSelect" class="ctx-select"></select>
    </span>
    <span class="spacer"></span>
    <span id="projectChip" class="project-chip empty">No project open</span>
    <span id="srcChip" class="src-chip">loading canonical models…</span>
  </header>
  <div id="ctxInfo" hidden></div>
  <div id="viewbar" hidden></div>
  <div id="content"></div>
</main>

<aside id="inspector" class="hidden">
  <div class="insp-head">
    <h3 id="inspTitle"></h3>
    <button class="insp-close" id="inspClose" title="Close">✕</button>
  </div>
  <div class="insp-body" id="inspBody"></div>
</aside>

<script src="js/studio-schema.js"></script>
<script src="js/vanilla-loader.js"></script>
<script src="js/diff.js"></script>
<script src="js/model.js"></script>
<script src="js/rules.js"></script>
<script src="js/buildplan.js"></script>
<script src="js/soldesign.js"></script>
<script src="js/harness-client.js"></script>
<script src="js/project.js"></script>
<script src="js/views/inspector.js"></script>
<script src="js/views/overview.js"></script>
<script src="js/views/diagram.js"></script>
<script src="js/views/actionmap.js"></script>
<script src="js/views/grid.js"></script>
<script src="js/views/config.js"></script>
<script src="js/views/design.js?v=2"></script>
<script src="js/views/findings.js"></script>
<script src="js/views/compare.js"></script>
<script src="js/views/solutiondesign.js"></script>
<script src="js/views/instance.js"></script>
<script src="js/views/build.js"></script>
<script src="js/views/evidence.js"></script>
<script src="js/views/projects.js"></script>
<script src="js/views/settings.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
